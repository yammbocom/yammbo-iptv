name = "yammbo-iptv"
main = "src/index.ts"
compatibility_date = "2026-04-27"
workers_dev = false

# No account_id on purpose (public repo): deploy.sh exports it at deploy time.
# Only /iptv/* : the rest of tv.yammbo.com stays on the origin.
routes = [{ pattern = "tv.yammbo.com/iptv/*", zone_name = "yammbo.com" }]

tail_consumers = [{ service = "yammbo-tail" }]

[vars]
DATA_URL = "https://raw.githubusercontent.com/yammbocom/yammbo-iptv/data/channels.json"
