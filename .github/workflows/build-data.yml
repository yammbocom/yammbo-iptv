name: Build data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build channels data
        env:
          UV_THREADPOOL_SIZE: "128"
          PREVIOUS_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/channels.json
        run: node scripts/build.mjs

      - name: Publish dist/ to orphan data branch
        run: |
          cd dist
          git init -b data
          git config user.name "Frank Rivera"
          git config user.email "168697695+yammbocom@users.noreply.github.com"
          git add channels.json report.json
          git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      # GitHub disables scheduled workflows after 60 days without repository
      # activity (public repos). Pushing to the data branch doesn't count as
      # activity on the default branch, so re-enable the workflow on every run
      # to reset the inactivity timer.
      - name: Keep scheduled workflow enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/build-data.yml/enable
